services:
  # PostgreSQL Database for Catalog Processing Worker
  postgres-catalog:
    extends:
      file: compose.base.yaml
      service: postgres-catalog

  # RabbitMQ for Catalog Processing Worker
  rabbitmq-catalog:
    extends:
      file: compose.base.yaml
      service: rabbitmq-catalog

  # DbGate - Database Administration Tool
  dbgate:
    extends:
      file: compose.base.yaml
      service: dbgate

  # Ollama — local LLM inference
  ollama:
    extends:
      file: compose.base.yaml
      service: ollama

  # Catalog Processing Worker - Full platform run including build phase
  catalog-service:
    extends:
      file: compose.base.yaml
      service: catalog-service

networks:
  catalog-service-network:
    name: foundation-catalog-network-dev
    external: false

volumes:
  postgres_catalog_data:
    name: docintelligence_catalog_postgres_data_dev
  rabbitmq_catalog_data:
    name: docintelligence_catalog_rabbitmq_data_dev
  dbgate_catalog_data:
    name: docintelligence_catalog_dbgate_data_dev
  catalog_logs:
    name: docintelligence_catalog_logs_dev
  catalog_tmp:
    name: docintelligence_catalog_tmp_dev
  ollama_catalog_data:
    name: docintelligence_catalog_ollama_data_dev
