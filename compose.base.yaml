services:
  # PostgreSQL Database for Catalog Processing Worker - Local Development
  postgres-catalog:
    image: postgres:17-alpine
    container_name: foundation-catalog-postgres-dev
    environment:
      POSTGRES_DB: catalogservice
      POSTGRES_USER: svc_catalog_dba
      POSTGRES_PASSWORD: svc_catalog_dba
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_catalog_data:/var/lib/postgresql/data
      - ./docker/postgres/init-catalog.sql:/docker-entrypoint-initdb.d/init-catalog.sql:ro
    networks:
      - catalog-service-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svc_catalog_dba -d catalogservice -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB

  # RabbitMQ for Catalog Processing Worker - Local Development
  rabbitmq-catalog:
    image: rabbitmq:3.13-management-alpine
    container_name: foundation-catalog-rabbitmq-dev
    environment:
      RABBITMQ_DEFAULT_USER: svc_catalog_rmq
      RABBITMQ_DEFAULT_PASS: svc_catalog_rmq
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit log_levels [{connection,error},{default,info}] disk_free_limit 2147483648
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_catalog_data:/var/lib/rabbitmq
    networks:
      - catalog-service-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # DbGate - Database Administration Tool
  dbgate:
    image: dbgate/dbgate:5.3.3
    container_name: foundation-catalog-dbgate-dev
    environment:
      WEB_ROOT: /
      LOGINS: "1"
    ports:
      - "3100:3000" # DbGate Web UI (port 3100 to avoid conflict with Grafana)
    volumes:
      - ./docker/dbgate/connections.jsonl:/root/.dbgate/connections.jsonl:ro
      - dbgate_catalog_data:/root/.dbgate
    networks:
      - catalog-service-network
    depends_on:
      postgres-catalog:
        condition: service_healthy
      rabbitmq-catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Catalog Processing Worker - Local Development
  catalog-service:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: builder
    image: iqkv/docintelligence-catalog-processing-worker:local
    container_name: docintelligence-catalog-processing-worker-dev
    environment:
      # Spring Configuration
      SPRING_PROFILES_ACTIVE: local
      SPRING_APPLICATION_NAME: docintelligence-catalog-processing-worker

      # Database Configuration
      DB_HOST: postgres-catalog
      DB_PORT: 5432
      DB_NAME: catalogservice
      DB_USERNAME: svc_catalog_dba
      DB_PASSWORD: svc_catalog_dba

      # RabbitMQ Configuration
      RABBITMQ_HOST: rabbitmq-catalog
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: svc_catalog_rmq
      RABBITMQ_PASSWORD: svc_catalog_rmq

      # Observability
      OTEL_SERVICE_NAME: docintelligence-catalog-processing-worker
      OTEL_RESOURCE_ATTRIBUTES: service.name=docintelligence-catalog-processing-worker,service.version=1.0.0,deployment.environment=dev

      # JVM Configuration
      JAVA_OPTS: >-
        -Xms256m
        -Xmx512m
        -XX:+UseG1GC
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -Djava.security.egd=file:/dev/./urandom

      # Ollama — local LLM inference
      SPRING_AI_OLLAMA_BASE_URL: "http://ollama:11434"
      SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL: "llama3.2"
    ports:
      - "8080:8080" # Application port
      - "8081:8081" # Actuator / management
    depends_on:
      postgres-catalog:
        condition: service_healthy
      rabbitmq-catalog:
        condition: service_healthy
    networks:
      - catalog-service-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    volumes:
      - catalog_logs:/app/logs
      - catalog_tmp:/app/tmp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 384M

  # Ollama — local LLM inference
  ollama:
    image: ollama/ollama:latest
    container_name: foundation-catalog-ollama-dev
    environment:
      # Allow requests from the service container and the local browser
      OLLAMA_ORIGINS: "http://localhost:8080,http://catalog-service:8080"
      # Keep models loaded indefinitely (no idle unload)
      OLLAMA_KEEP_ALIVE: -1
    ports:
      - "11434:11434" # Ollama REST API
    volumes:
      - ollama_catalog_data:/root/.ollama
    networks:
      - catalog-service-network
    restart: unless-stopped
    # Pull a model after first start:
    #   docker exec foundation-catalog-ollama-dev ollama pull llama3.2

  # SonarQube for code quality analysis
  sonar:
    image: sonarqube:25.3.0.104237-community
    container_name: foundation-catalog-sonarqube-dev
    environment:
      - SONAR_FORCEAUTHENTICATION=false
    ports:
      - "127.0.0.1:9001:9000"
      - "127.0.0.1:9000:9000"
    networks:
      - catalog-service-network
    restart: unless-stopped

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: foundation-catalog-prometheus-dev
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - catalog-service-network
    restart: unless-stopped

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: foundation-catalog-grafana-dev
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - catalog-service-network
    restart: unless-stopped

networks:
  catalog-service-network:
    driver: bridge
    name: docintelligence-catalog-processing-worker-network-dev
    ipam:
      config:
        # Pick a unique /16 block for each new service to avoid subnet conflicts.
        # Assigned ranges across foundation services:
        #   172.20.0.0/16  — reserved for this layout template / new services
        #   172.21.0.0/16  — foundation-iam-service
        #   172.22.0.0/16  — foundation-billing-service
        #   172.23.0.0/16  — foundation-gateway-service
        #   172.24.0.0/16  — foundation-cms-service
        #   172.25.0.0/16  — foundation-audit-service
        #   172.26.0.0/16  — docintelligence-catalog-processing-worker
        #   172.27.0.0/16  — next available
        - subnet: 172.26.0.0/16

volumes:
  postgres_catalog_data:
    name: docintelligence_catalog_postgres_data_dev
    driver: local
  rabbitmq_catalog_data:
    name: docintelligence_catalog_rabbitmq_data_dev
    driver: local
  dbgate_catalog_data:
    name: docintelligence_catalog_dbgate_data_dev
    driver: local
  catalog_logs:
    name: docintelligence_catalog_logs_dev
    driver: local
  catalog_tmp:
    name: docintelligence_catalog_tmp_dev
    driver: local
  ollama_catalog_data:
    name: docintelligence_catalog_ollama_data_dev
    driver: local
