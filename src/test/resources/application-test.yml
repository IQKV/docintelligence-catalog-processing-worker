# ===================================================================
# Spring Boot configuration for the "test" profile.
# Activated via @ActiveProfiles("test") on test classes.
# Only contains overrides and test-specific values relative to application.yml.
# ===================================================================

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.2
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.ai.autoconfigure.ollama.OllamaChatAutoConfiguration
      - org.springframework.ai.autoconfigure.ollama.OllamaAutoConfiguration

iqkv:
  messaging:
    rabbitmq:
      enabled: false
