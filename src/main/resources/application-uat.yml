# ===================================================================
# Spring Boot configuration for the "uat" profile (staging).
# Overrides base: points to in-cluster service names, all secrets via
# env vars (no defaults).
# ===================================================================

logging:
  level:
    com.iqkv: DEBUG

iqkv:
  db:
    host: ${DB_HOST}
    port: ${DB_PORT}
    name: ${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
