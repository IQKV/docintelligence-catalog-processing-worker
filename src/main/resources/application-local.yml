# ===================================================================
# Spring Boot configuration for the "local" profile.
# Overrides base: relaxes actuator exposure and enables debug logging.
# Run infrastructure with: docker compose up postgres-catalog rabbitmq-catalog
# ===================================================================

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    com.iqkv: DEBUG
    org.mybatis: DEBUG
    org.springframework.web: INFO

iqkv:
  messaging:
    rabbitmq:
      enabled: true
